<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Windows 8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Пуск</h1>

    <div class="menu">

        <div class="group">
            <h2>Основное</h2>
            <div class="tiles">
                <div class="tile blue">Рабочий стол</div>
                <div class="tile purple">Почта</div>
                <div class="tile orange wide">Календарь</div>
                <div class="tile green">Музыка</div>
                <div class="tile red">Видео</div>
            </div>
        </div>

        <div class="group">
            <h2>Интернет</h2>
            <div class="tiles">
                <div class="tile teal wide">Интернет</div>
                <div class="tile pink">Люди</div>
                <div class="tile blue">Сообщения</div>
                <div class="tile dark">Облако</div>
                <div class="tile orange">Новости</div>
            </div>
        </div>

        <div class="group">
            <h2>Программы</h2>
            <div class="tiles">
                <div class="tile green">Фото</div>
                <div class="tile purple">Карты</div>
                <div class="tile red wide">Магазин</div>
                <div class="tile blue">Параметры</div>
                <div class="tile teal">Помощь</div>
            </div>
        </div>

    </div>

</body>
</html>
